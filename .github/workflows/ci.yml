name: CI contrat

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existant à publier (vX.Y.Z)'
        type: string
        required: true
      dry_run:
        description: 'Ne pas créer la release (les artefacts sont quand même générés)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  # Un run de tag ou de déclenchement manuel n'est jamais annulé.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}

jobs:
  validate:
    name: Lint et génération
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Contrôler le format du tag
        if: env.TAG != ''
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Format de tag invalide." >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Lint Redocly
        run: npm run lint
      - name: Génération et contrôle des types
        run: npm run generate:check

  release:
    name: Publication des clients
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # création de la release avec le GITHUB_TOKEN fourni, aucun secret à configurer
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Contrôler le format du tag
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Format de tag invalide." >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier que le commit tagué est dans main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "Le commit du tag ${TAG} n'est pas ancêtre de origin/main." >&2; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Vérifier les versions (tag, info.version, package.json)
        run: node scripts/check-version.mjs
      - name: Générer les clients Dart et TypeScript
        run: |
          npm run generate:dart
          npm run generate:ts
      - name: Archiver
        run: |
          mkdir -p dist
          (cd generated/dart && zip -qr "../../dist/nautilus-client-dart-${TAG}.zip" .)
          (cd generated/ts && zip -qr "../../dist/nautilus-client-typescript-angular-${TAG}.zip" .)
          cp openapi.yaml "dist/openapi-${TAG}.yaml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clients-${{ env.TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Créer la release GitHub
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes --verify-tag
